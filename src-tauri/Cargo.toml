[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "perch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri only embeds the built frontend (dist/) when `custom-protocol` is on.
# `cargo tauri build` turns it on; a plain `cargo build` does not — so a plain
# build produces a binary that expects a dev server instead of the shipped UI.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
perch-core = { path = "../crates/perch-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
