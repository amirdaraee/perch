# Builds the universal Perch.app and publishes it to GitHub Releases.
#
# Two modes, chosen by which secrets exist -- no code change between them:
#
#   ad-hoc     No signing secrets. The app is ad-hoc signed and users have to
#              click "Open Anyway" in System Settings on first launch.
#
#   notarized  All five secrets below are set. The app is signed with the
#              Developer ID certificate, notarized by Apple and stapled, so it
#              opens like any other downloaded app.
#
# Some-but-not-all of the secrets is an error, not a quiet fall back to ad-hoc:
# a release that was meant to be notarized and silently wasn't is exactly the
# mistake nobody notices until users do.
#
# The jobs, and why there are four:
#
#   mode     Looks at which secrets exist. Runs no project code.
#   build    Builds and ad-hoc signs the app. Has no secrets at all: this is
#            where every dependency's build script runs, so nothing it could
#            leave behind ever shares a machine with the signing key.
#   sign     Notarized mode only. A fresh runner that builds nothing: it takes
#            the bundle from `build`, signs it with the Developer ID, notarizes
#            and staples it.
#   publish  Creates the GitHub release. The only job that can write to the
#            repo.
#
# Setting up the secrets, once there is an Apple Developer account: create an
# environment called `release` (Settings -> Environments), and add these as
# environment secrets there, so only the jobs that declare that environment
# can read them. Restrict the environment's deployment branches and tags to
# `main` and `v*`.
#
#   MACOS_CERT_P12        Create a "Developer ID Application" certificate at
#                         developer.apple.com, install it, export it from
#                         Keychain Access as a .p12 with a password, then:
#                           base64 -i cert.p12 | pbcopy
#   MACOS_CERT_PASSWORD   The password you exported the .p12 with.
#   NOTARY_KEY_P8         App Store Connect -> Users and Access -> Integrations
#                         -> Team Keys: create a key with the Developer role and
#                         download AuthKey_XXXXXXXXXX.p8 (it can only be
#                         downloaded once). Paste the file's contents as-is.
#   NOTARY_KEY_ID         The key's ID, the XXXXXXXXXX in the file name.
#   NOTARY_ISSUER_ID      The Issuer ID shown above the list of keys.
#
# To try the setup without publishing anything, run this workflow by hand
# (Actions -> Release -> Run workflow). It does everything except create the
# release, and attaches the zip to the run instead.
#
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to
# different code, and these run next to the signing key. Dependabot proposes
# updates.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mode:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      mode: ${{ steps.choose.outputs.mode }}
    steps:
      - name: Choose ad-hoc or notarized
        id: choose
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -uo pipefail
          set_count=0
          missing=()
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -n "${!name:-}" ]; then set_count=$((set_count + 1)); else missing+=("$name"); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "No signing secrets: building an ad-hoc signed release."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          elif [ "$set_count" -eq 5 ]; then
            echo "All signing secrets present: building a notarized release."
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing is half set up. Missing: ${missing[*]}. Add them, or remove the others to release ad-hoc."
            exit 1
          fi

  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # No rust-cache here on purpose: a release is built from a clean slate,
      # never from a cache another workflow run could have written.

      - name: Work out the version
        id: version
        run: |
          set -uo pipefail
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                    apps/macos/Perch/Resources/Info.plist)
          echo "cargo=$CARGO plist=$PLIST ref=$GITHUB_REF_NAME"
          if [ "$CARGO" != "$PLIST" ]; then
            echo "::error::Cargo.toml ($CARGO) and Info.plist ($PLIST) disagree. Bump both."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME disagrees with the source ($CARGO). Bump both, then retag."
            exit 1
          fi
          echo "version=$CARGO" >> "$GITHUB_OUTPUT"

      - run: scripts/build-xcframework.sh

      - name: Build the universal bundle and zip it
        working-directory: apps/macos/Perch
        run: make release

      - name: Check the build
        working-directory: apps/macos/Perch
        env:
          ZIP: build/Perch-${{ steps.version.outputs.version }}-macos.zip
        run: ../../../scripts/check-release.sh "$ZIP" adhoc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adhoc
          path: apps/macos/Perch/build/Perch-${{ steps.version.outputs.version }}-macos.zip
          if-no-files-found: error

  sign:
    needs: [mode, build]
    if: needs.mode.outputs.mode == 'notarized'
    runs-on: macos-latest
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Only for the Makefile and scripts; nothing is built in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adhoc
          path: ${{ runner.temp }}/adhoc

      - name: Unpack the bundle
        working-directory: apps/macos/Perch
        run: |
          set -euo pipefail
          mkdir -p build
          ditto -x -k "$RUNNER_TEMP/adhoc/Perch-$VERSION-macos.zip" build

      # Import, sign and throw away in one step. The keychain is a temporary
      # one, deleted on the way out whether signing worked or not; the
      # certificate never touches the login keychain.
      - name: Sign with the Developer ID
        working-directory: apps/macos/Perch
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT="$RUNNER_TEMP/cert.p12"
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          cleanup() {
            rm -f "$CERT"
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS || true
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Locks itself after five minutes, in case the trap never runs.
          security set-keychain-settings -lut 300 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERT"
          # Lets codesign use the key without a GUI prompt nobody can click.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL_KEYCHAINS

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                       | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12 has no 'Developer ID Application' identity in it. An 'Apple Development' or 'Mac App Distribution' certificate can't be notarized for direct download."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $IDENTITY"

          make sign package SIGN_IDENTITY="$IDENTITY"

      # The API key is written, used and deleted inside this one step, and
      # readable only by the runner's user while it exists.
      - name: Notarize and staple
        working-directory: apps/macos/Perch
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          make notarize

      - name: Check what users will download
        working-directory: apps/macos/Perch
        run: ../../../scripts/check-release.sh "build/Perch-$VERSION-macos.zip" notarized

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized
          path: apps/macos/Perch/build/Perch-${{ env.VERSION }}-macos.zip
          if-no-files-found: error

      # Belt and braces: the steps above clean up after themselves, but a
      # cancelled job can skip a trap.
      - name: Remove any signing material left behind
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    needs: [mode, build, sign]
    # Runs after `sign`, or without it in ad-hoc mode -- but never after a
    # `sign` that failed.
    if: >-
      always() && needs.mode.result == 'success' && needs.build.result == 'success'
      && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && needs.mode.outputs.mode == 'adhoc'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MODE: ${{ needs.mode.outputs.mode }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.mode.outputs.mode }}
          path: dist

      - name: Write the release notes
        run: |
          set -uo pipefail
          ZIP_NAME="Perch-$VERSION-macos.zip"
          SHA=$(sha256sum "dist/$ZIP_NAME" | cut -d' ' -f1)

          {
            echo "## Install"
            echo
            echo "Requires macOS 15 or later. Universal (Apple Silicon and Intel)."
            echo
            echo "Download \`$ZIP_NAME\`, unzip it, and drag \`Perch.app\` to \`/Applications\`."
            echo
            if [ "$MODE" = notarized ]; then
              echo "Perch is signed with a Developer ID and notarized by Apple, so it"
              echo "opens like any other app you download."
            else
              echo "**The first launch will be blocked.** Perch is signed, but with an"
              echo "ad-hoc signature rather than a paid Apple Developer ID, so macOS"
              echo "treats it as coming from an unidentified developer. To open it:"
              echo
              echo "> **System Settings → Privacy & Security**, scroll to the bottom, and"
              echo "> click **\"Open Anyway\"** next to the message about Perch."
              echo
              echo "On macOS 15 this is the only route — the old right-click → Open trick"
              echo "no longer works for unsigned apps."
              echo
              echo "If you would rather not run an unidentified binary at all, that is a"
              echo "reasonable instinct for an app that reads your transcripts. Building"
              echo "from source is two commands; see the README."
            fi
            echo
            echo "## Verify the download"
            echo
            echo '```'
            echo "shasum -a 256 $ZIP_NAME"
            echo "$SHA"
            echo '```'
            echo
            echo "## Changes"
          } > notes.md
          cat notes.md

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Perch-$VERSION-macos.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Perch $VERSION" \
            --notes-file notes.md \
            --generate-notes

      # A manual run publishes nothing; the zip and notes are attached to the
      # run so the result can be downloaded and tried.
      - name: Keep the dry-run build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Perch-${{ env.VERSION }}-${{ env.MODE }}-dry-run
          path: |
            dist/Perch-${{ env.VERSION }}-macos.zip
            notes.md
