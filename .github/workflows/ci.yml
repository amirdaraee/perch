name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `src-tauri` (the app crate) links against webkit2gtk and friends, which
        # only macos-latest has available. ubuntu-latest can't build it, so Linux
        # is scoped to the portable data-layer crates (perch-core, perch-cli)
        # rather than the whole workspace. macOS keeps proving the full workspace
        # builds; Linux keeps proving the data layer stays portable and doesn't
        # quietly grow a dependency on the app crate or its platform-only deps.
        include:
          - os: macos-latest
            cargo-scope: --workspace
          - os: ubuntu-latest
            cargo-scope: -p perch-core -p perch-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy ${{ matrix.cargo-scope }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.cargo-scope }}

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build -p perch-app

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no HTTP client or telemetry dependencies
        run: |
          set -uo pipefail

          HTTP='^(reqwest|hyper|ureq|curl|isahc|surf)\b'
          TELEMETRY='^(sentry|posthog|segment|mixpanel|datadog|analytics)\b'
          LOCKED='^name = "(reqwest|hyper|ureq|curl|isahc|surf|sentry|posthog|segment|mixpanel|datadog)"'

          # src-tauri is exactly where an HTTP client would plausibly be added
          # first, so it must be scanned exactly like every other crate's
          # manifest. Named as its own variable (rather than inlined below) so
          # the self-test right below reuses the identical path string — a
          # typo here would otherwise fail silently and the self-test would
          # never catch it.
          SRC_TAURI_MANIFEST=src-tauri/Cargo.toml

          # Positive control: the patterns must actually detect a known offender.
          # Without this, a future edit that breaks the regex would pass silently forever —
          # which is exactly the failure this guard was found to have.
          printf 'reqwest.workspace = true\n' > /tmp/guard-selftest.toml
          if ! grep -qE "$HTTP" /tmp/guard-selftest.toml; then
            echo "::error::Guard self-test failed: the HTTP pattern no longer detects a known offender."
            exit 1
          fi
          printf 'name = "reqwest"\n' > /tmp/guard-selftest.lock
          if ! grep -qE "$LOCKED" /tmp/guard-selftest.lock; then
            echo "::error::Guard self-test failed: the lockfile pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/Cargo.toml (never the real file — this lives
          # entirely under /tmp), scanned through the exact path string the
          # real check below uses, must trip the guard. This is the gap the
          # task set out to close: a manifest edit here was previously caught
          # only indirectly via the Cargo.lock scan, and only while the
          # committed lockfile was in sync.
          SELFTEST_ROOT=/tmp/no-network-selftest-manifest
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$(dirname "$SELFTEST_ROOT/$SRC_TAURI_MANIFEST")"
          printf 'reqwest.workspace = true\n' > "$SELFTEST_ROOT/$SRC_TAURI_MANIFEST"
          if ! ( cd "$SELFTEST_ROOT" && grep -rEn "$HTTP" "$SRC_TAURI_MANIFEST" ) > /dev/null; then
            echo "::error::Guard self-test failed: the manifest glob no longer reaches $SRC_TAURI_MANIFEST."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Manifests: matches both `dep = "1"` and `dep.workspace = true`.
          if grep -rEn "$HTTP" Cargo.toml crates/*/Cargo.toml "$SRC_TAURI_MANIFEST"; then
            echo "::error::An HTTP client was added. The data layer must make no outbound requests."
            exit 1
          fi
          if grep -rEni "$TELEMETRY" Cargo.toml crates/*/Cargo.toml "$SRC_TAURI_MANIFEST"; then
            echo "::error::Telemetry dependency detected. Perch ships no telemetry."
            exit 1
          fi

          # Lockfile: catches transitive pulls that no manifest names. One
          # workspace lockfile already covers src-tauri's resolved deps too.
          if grep -En "$LOCKED" Cargo.lock; then
            echo "::error::A forbidden crate appears in the resolved dependency graph."
            exit 1
          fi

          echo "no HTTP client or telemetry dependencies found (manifests, workspace root, src-tauri, and lockfile)"

      - name: Assert no hand-rolled sockets in the source
        run: |
          set -uo pipefail

          # A dependency audit alone cannot see a socket opened with std::net,
          # which needs no dependency at all. Spec 10 promises a dependency AND
          # source audit; this is the source half.
          SOCKETS='std::net|TcpStream|UdpSocket|TcpListener'

          # A hand-rolled socket written directly in src-tauri/src is caught by
          # nothing else in this project — no manifest or lockfile entry would
          # ever name it. Named as its own variable so the self-test below
          # scans the identical root the real audit uses.
          SRC_TAURI_SRC_DIR=src-tauri/src

          # Positive control: the pattern must actually detect a known offender.
          printf 'let s = TcpStream::connect("example.com:80")?;\n' > /tmp/socket-selftest.rs
          if ! grep -qE "$SOCKETS" /tmp/socket-selftest.rs; then
            echo "::error::Guard self-test failed: the socket pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/src/x.rs (never the real source tree — this lives
          # entirely under /tmp), discovered through the exact `find` root the
          # real audit below uses, must trip the guard.
          SELFTEST_ROOT=/tmp/no-network-selftest-socket
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR"
          printf 'fn x() { let _ = TcpStream::connect("example.com:80"); }\n' \
            > "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR/x.rs"
          if ! ( cd "$SELFTEST_ROOT" && find "$SRC_TAURI_SRC_DIR" -name '*.rs' -print0 \
                 | xargs -0 grep -qE "$SOCKETS" ); then
            echo "::error::Guard self-test failed: the source-audit root no longer reaches $SRC_TAURI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          if { find crates -path 'crates/*/src/*' -name '*.rs' -print0; \
               find "$SRC_TAURI_SRC_DIR" -name '*.rs' -print0; } \
             | xargs -0 grep -nE "$SOCKETS"; then
            echo "::error::A raw socket appears in the source. The data layer makes no outbound requests."
            exit 1
          fi

          echo "no raw sockets found in crates/*/src or $SRC_TAURI_SRC_DIR"

      - name: Assert perch-core and the app crate never write to the filesystem
        run: |
          set -uo pipefail

          # The README's other headline promise: Perch never writes to, moves, or
          # deletes anything in your Claude Code directory. perch-core is the only
          # crate that reads that directory, and src-tauri (the app crate) is
          # exactly where a stray write would plausibly be added first — both
          # must hold no filesystem-writing API outside of Perch's own data.
          #
          # `create_dir_all` is deliberately NOT in this list, and db.rs
          # (perch-core) is deliberately excluded: it creates the parent
          # directory of Perch's OWN index database and opens that database,
          # which is Perch's file, not Claude Code's. commands.rs (src-tauri) is
          # excluded for the same reason: it resolves and opens that same
          # database from Perch's own app-data directory
          # (~/Library/Application Support/Perch) — again Perch's file, not
          # Claude Code's. Every other module in both crates must be write-free.
          WRITES='fs::write|fs::remove_file|fs::remove_dir|File::create|OpenOptions'
          SRC_TAURI_SRC_DIR=src-tauri/src
          SRC_TAURI_WRITE_EXCLUDE=commands.rs

          # Only the production half of each file is audited. Test modules write
          # fixtures into a tempdir, which is legitimate and never ships; `prod`
          # cuts each file at its `#[cfg(test)]` line.
          prod() { awk '/^#\[cfg\(test\)\]/{exit} {print FILENAME ":" FNR ": " $0}' "$1"; }

          # Positive control, through the very same `prod` + grep path the real
          # check uses, so a break in either half fails here first.
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' > /tmp/write-selftest.rs
          if ! prod /tmp/write-selftest.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the write pattern no longer detects a known offender."
            exit 1
          fi
          # And the exclusion itself must work: a match below #[cfg(test)] is ignored.
          printf '#[cfg(test)]\nmod tests { fs::write("/tmp/x", "y"); }\n' > /tmp/write-selftest-cfg.rs
          if prod /tmp/write-selftest-cfg.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the #[cfg(test)] exclusion is not excluding."
            exit 1
          fi

          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/src/x.rs (never the real source tree — this lives
          # entirely under /tmp, and is NOT named commands.rs, which is excluded
          # below for the same reason db.rs is) must still trip the guard.
          SELFTEST_ROOT=/tmp/no-network-selftest-write
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR"
          printf 'fn main() { File::create("/tmp/x").unwrap(); }\n' \
            > "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR/x.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find "$SRC_TAURI_SRC_DIR" -name '*.rs' ! -name "$SRC_TAURI_WRITE_EXCLUDE"); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: the write guard no longer reaches $SRC_TAURI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          offenders=0
          for f in $(find crates/perch-core/src -name '*.rs' ! -name 'db.rs') \
                   $(find "$SRC_TAURI_SRC_DIR" -name '*.rs' ! -name "$SRC_TAURI_WRITE_EXCLUDE"); do
            if prod "$f" | grep -E "$WRITES"; then
              offenders=1
            fi
          done
          if [ "$offenders" -ne 0 ]; then
            echo "::error::perch-core or the app crate gained a filesystem-writing call. Perch is read-only with respect to ~/.claude."
            exit 1
          fi

          echo "no filesystem writes found in perch-core (db.rs excluded) or $SRC_TAURI_SRC_DIR ($SRC_TAURI_WRITE_EXCLUDE excluded)"
