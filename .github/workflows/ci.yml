name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `src-tauri` (the app crate) links against webkit2gtk and friends, which
        # only macos-latest has available. ubuntu-latest can't build it, so Linux
        # is scoped to the portable data-layer crates (perch-core, perch-cli,
        # perch-ffi) rather than the whole workspace. perch-ffi is included
        # because it's the UniFFI surface the native macOS app is built on, and
        # it must keep compiling on Linux for the same reason perch-core does:
        # so a later Linux/Windows shell can reuse it. macOS keeps proving the
        # full workspace builds; Linux keeps proving the data layer stays
        # portable and doesn't quietly grow a dependency on the app crate or its
        # platform-only deps.
        include:
          - os: macos-latest
            cargo-scope: --workspace
          - os: ubuntu-latest
            cargo-scope: -p perch-core -p perch-cli -p perch-ffi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy ${{ matrix.cargo-scope }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.cargo-scope }}

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # --features custom-protocol proves the *shippable* artifact (frontend
      # embedded from dist/, which the pnpm build step above just produced)
      # compiles, not the dev-server variant a plain cargo build produces.
      - run: cargo build -p perch-app --features custom-protocol

  no-network:
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the `test` job's split, and for the same reason: the
        # resolved-graph check below needs an actual Cargo toolchain now, and
        # `perch-app` (src-tauri) only resolves against the deps its
        # macOS-only `[target.'cfg(...)']` sections declare when run where
        # they apply. macOS proves the full workspace graph, including the
        # app crate, is clean; Linux keeps proving the portable data-layer
        # crates (including perch-ffi) stay clean on their own.
        include:
          - os: macos-latest
            cargo-scope: --workspace
          - os: ubuntu-latest
            cargo-scope: -p perch-core -p perch-cli -p perch-ffi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert no HTTP client or telemetry dependencies
        run: |
          set -uo pipefail

          HTTP='^(reqwest|hyper|ureq|curl|isahc|surf)\b'
          TELEMETRY='^(sentry|posthog|segment|mixpanel|datadog|analytics)\b'

          # src-tauri is exactly where an HTTP client would plausibly be added
          # first, so it must be scanned exactly like every other crate's
          # manifest. Named as its own variable (rather than inlined below) so
          # the self-test right below reuses the identical path string — a
          # typo here would otherwise fail silently and the self-test would
          # never catch it.
          SRC_TAURI_MANIFEST=src-tauri/Cargo.toml

          # Positive control: the patterns must actually detect a known offender.
          # Without this, a future edit that breaks the regex would pass silently forever —
          # which is exactly the failure this guard was found to have.
          printf 'reqwest.workspace = true\n' > /tmp/guard-selftest.toml
          if ! grep -qE "$HTTP" /tmp/guard-selftest.toml; then
            echo "::error::Guard self-test failed: the HTTP pattern no longer detects a known offender."
            exit 1
          fi
          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/Cargo.toml (never the real file — this lives
          # entirely under /tmp), scanned through the exact path string the
          # real check below uses, must trip the guard. This is the gap the
          # task set out to close: a manifest edit here was previously caught
          # only indirectly via the Cargo.lock scan, and only while the
          # committed lockfile was in sync.
          SELFTEST_ROOT=/tmp/no-network-selftest-manifest
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$(dirname "$SELFTEST_ROOT/$SRC_TAURI_MANIFEST")"
          printf 'reqwest.workspace = true\n' > "$SELFTEST_ROOT/$SRC_TAURI_MANIFEST"
          if ! ( cd "$SELFTEST_ROOT" && grep -rEn "$HTTP" "$SRC_TAURI_MANIFEST" ) > /dev/null; then
            echo "::error::Guard self-test failed: the manifest glob no longer reaches $SRC_TAURI_MANIFEST."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Manifests: matches both `dep = "1"` and `dep.workspace = true`.
          if grep -rEn "$HTTP" Cargo.toml crates/*/Cargo.toml "$SRC_TAURI_MANIFEST"; then
            echo "::error::An HTTP client was added. The data layer must make no outbound requests."
            exit 1
          fi
          if grep -rEni "$TELEMETRY" Cargo.toml crates/*/Cargo.toml "$SRC_TAURI_MANIFEST"; then
            echo "::error::Telemetry dependency detected. Perch ships no telemetry."
            exit 1
          fi

          echo "no HTTP client or telemetry dependencies found (manifests, workspace root, and src-tauri)"

      - name: Assert no hand-rolled sockets in the source
        run: |
          set -uo pipefail

          # A dependency audit alone cannot see a socket opened with std::net,
          # which needs no dependency at all. Spec 10 promises a dependency AND
          # source audit; this is the source half.
          SOCKETS='std::net|TcpStream|UdpSocket|TcpListener'

          # A hand-rolled socket written directly in src-tauri/src is caught by
          # nothing else in this project — no manifest or lockfile entry would
          # ever name it. Named as its own variable so the self-test below
          # scans the identical root the real audit uses.
          SRC_TAURI_SRC_DIR=src-tauri/src

          # Positive control: the pattern must actually detect a known offender.
          printf 'let s = TcpStream::connect("example.com:80")?;\n' > /tmp/socket-selftest.rs
          if ! grep -qE "$SOCKETS" /tmp/socket-selftest.rs; then
            echo "::error::Guard self-test failed: the socket pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/src/x.rs (never the real source tree — this lives
          # entirely under /tmp), discovered through the exact `find` root the
          # real audit below uses, must trip the guard.
          SELFTEST_ROOT=/tmp/no-network-selftest-socket
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR"
          printf 'fn x() { let _ = TcpStream::connect("example.com:80"); }\n' \
            > "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR/x.rs"
          if ! ( cd "$SELFTEST_ROOT" && find "$SRC_TAURI_SRC_DIR" -name '*.rs' -print0 \
                 | xargs -0 grep -qE "$SOCKETS" ); then
            echo "::error::Guard self-test failed: the source-audit root no longer reaches $SRC_TAURI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          if { find crates -path 'crates/*/src/*' -name '*.rs' -print0; \
               find "$SRC_TAURI_SRC_DIR" -name '*.rs' -print0; } \
             | xargs -0 grep -nE "$SOCKETS"; then
            echo "::error::A raw socket appears in the source. The data layer makes no outbound requests."
            exit 1
          fi

          echo "no raw sockets found in crates/*/src or $SRC_TAURI_SRC_DIR"

      - name: Assert perch-core, perch-ffi, and the app crate never write to the filesystem
        run: |
          set -uo pipefail

          # The README's other headline promise: Perch never writes to, moves, or
          # deletes anything in your Claude Code directory. perch-core is the only
          # crate that reads that directory; perch-ffi is the UniFFI surface that
          # now resolves Perch's own data path (app_data_db) and drives indexing
          # for the native macOS app, so a stray write there would be exactly as
          # bad; and src-tauri (the app crate) is exactly where a stray write
          # would plausibly be added first. All three must hold no
          # filesystem-writing API outside of Perch's own data.
          #
          # `create_dir_all` is deliberately NOT in this list, and exactly two
          # files under perch-core are deliberately excluded, each for a write
          # to Perch's OWN data, never anything inside the Claude Code
          # directory: db.rs creates the parent directory of and opens Perch's
          # own index database, and settings/store.rs creates the parent
          # directory of and writes Perch's own config.toml. Both exclusions
          # below use `-path` (the full path from the repo root) rather than
          # `-name` (the basename alone) — `-name 'db.rs'` or `-name
          # 'store.rs'` would silently exclude *any* file with that basename
          # anywhere under the tree, not just these two exact files. Copy this
          # `-path`, not `-name`, if a third file ever needs excluding here.
          # Nothing under crates/perch-ffi/src or src-tauri/src is excluded —
          # commands.rs performs no writes of its own (it delegates to
          # db::open), and it is the file most likely to gain one, so it is
          # audited like every other module.
          WRITES='fs::write|fs::remove_file|fs::remove_dir|File::create|OpenOptions'
          FFI_SRC_DIR=crates/perch-ffi/src
          SRC_TAURI_SRC_DIR=src-tauri/src

          # Only the production half of each file is audited. Test modules write
          # fixtures into a tempdir, which is legitimate and never ships; `prod`
          # cuts each file at its `#[cfg(test)]` line.
          prod() { awk '/^#\[cfg\(test\)\]/{exit} {print FILENAME ":" FNR ": " $0}' "$1"; }

          # Positive control, through the very same `prod` + grep path the real
          # check uses, so a break in either half fails here first.
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' > /tmp/write-selftest.rs
          if ! prod /tmp/write-selftest.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the write pattern no longer detects a known offender."
            exit 1
          fi
          # And the exclusion itself must work: a match below #[cfg(test)] is ignored.
          printf '#[cfg(test)]\nmod tests { fs::write("/tmp/x", "y"); }\n' > /tmp/write-selftest-cfg.rs
          if prod /tmp/write-selftest-cfg.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the #[cfg(test)] exclusion is not excluding."
            exit 1
          fi

          # Positive control for the src-tauri coverage: a fixture placed as if
          # it were src-tauri/src/x.rs (never the real source tree — this lives
          # entirely under /tmp) must trip the guard.
          SELFTEST_ROOT=/tmp/no-network-selftest-write
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR"
          printf 'fn main() { File::create("/tmp/x").unwrap(); }\n' \
            > "$SELFTEST_ROOT/$SRC_TAURI_SRC_DIR/x.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find "$SRC_TAURI_SRC_DIR" -name '*.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: the write guard no longer reaches $SRC_TAURI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Positive control for the perch-ffi coverage: a fixture placed as if
          # it were crates/perch-ffi/src/x.rs (never the real source tree — this
          # lives entirely under /tmp) must trip the guard. No exclusion is
          # needed here (unlike perch-core's db.rs): perch-ffi has no file of
          # its own that opens or creates Perch's database — it calls
          # perch-core's db::open for that — so nothing in its source is a
          # legitimate write to exclude.
          SELFTEST_ROOT=/tmp/no-network-selftest-write-ffi
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$FFI_SRC_DIR"
          printf 'fn main() { File::create("/tmp/x").unwrap(); }\n' \
            > "$SELFTEST_ROOT/$FFI_SRC_DIR/x.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find "$FFI_SRC_DIR" -name '*.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: the write guard no longer reaches $FFI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Positive control proving the perch-core exclusions are matched by
          # full path, not basename: a decoy file with the *same basename* as
          # an excluded file, but at a *different path* (never the real source
          # tree — this lives entirely under /tmp), must still trip the
          # guard. If either exclusion below used `-name` instead of `-path`,
          # these decoys would be silently excluded too and this self-test
          # would fail. Mirrors the analogous same-basename check the Swift
          # guard already runs for LauncherHelper.swift.
          SELFTEST_ROOT=/tmp/no-network-selftest-write-core-path
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/crates/perch-core/src/decoy"
          mkdir -p "$SELFTEST_ROOT/crates/perch-core/src/settings/decoy"
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' \
            > "$SELFTEST_ROOT/crates/perch-core/src/decoy/db.rs"
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' \
            > "$SELFTEST_ROOT/crates/perch-core/src/settings/decoy/store.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find crates/perch-core/src -name '*.rs' \
                       ! -path 'crates/perch-core/src/db.rs' \
                       ! -path 'crates/perch-core/src/settings/store.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: a same-basename decoy (db.rs or store.rs) at a different path was wrongly excluded — the exclusion must match by full path, not basename."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          offenders=0
          for f in $(find crates/perch-core/src -name '*.rs' \
                       ! -path 'crates/perch-core/src/db.rs' \
                       ! -path 'crates/perch-core/src/settings/store.rs') \
                   $(find "$FFI_SRC_DIR" -name '*.rs') \
                   $(find "$SRC_TAURI_SRC_DIR" -name '*.rs'); do
            if prod "$f" | grep -E "$WRITES"; then
              offenders=1
            fi
          done
          if [ "$offenders" -ne 0 ]; then
            echo "::error::perch-core, perch-ffi, or the app crate gained a filesystem-writing call. Perch is read-only with respect to ~/.claude."
            exit 1
          fi

          echo "no filesystem writes found in perch-core (db.rs and settings/store.rs excluded), $FFI_SRC_DIR, or $SRC_TAURI_SRC_DIR (nothing excluded)"

      - name: Assert forbidden crates are unreachable in the resolved dependency graph
        run: |
          set -uo pipefail

          # A lockfile lists every platform's dependencies — tauri declares
          # reqwest/hyper as dependencies of its Android/iOS targets, which we
          # never build, so a plain `grep Cargo.lock` here produced a false
          # positive (found by actually running this check by hand). `cargo
          # tree -i` against the HOST build graph keeps the property we
          # wanted from the lockfile scan — catching transitive pulls that no
          # manifest names — while ignoring deps gated to platforms this
          # workspace never builds.
          FORBIDDEN="reqwest hyper ureq curl isahc surf sentry posthog segment mixpanel datadog"

          # `cargo tree -i <crate-absent-from-the-graph>` prints a "nothing to
          # print" warning to stderr and exits 0 (verified by hand: `cargo
          # tree -i reqwest -p perch-app; echo $?` prints the warning and
          # `0`). So this checks stdout content, never the exit code — trusting
          # the exit code here would make every iteration of the loop below
          # silently "pass" regardless of what is actually in the graph.
          #
          # Positive control: the probe must find a crate that IS present, or
          # a broken invocation would silently pass everything. Uses the same
          # ${{ matrix.cargo-scope }} the loop below consumes (not a
          # hardcoded -p perch-core) — serde is depended on by every
          # workspace member, so this also proves the scope string itself is
          # well-formed. A malformed scope (e.g. a typo'd flag) would make
          # every `cargo tree` call below fail with empty stdout, which reads
          # as "crate absent" and would let the job report clean; catching
          # that here is the whole point of a self-test, so it must fail the
          # same way the real check would.
          if ! cargo tree -i serde ${{ matrix.cargo-scope }} --edges normal 2>/dev/null | grep -q '^serde '; then
            echo "::error::Guard self-test failed: cargo tree did not find serde under scope '${{ matrix.cargo-scope }}'."
            exit 1
          fi

          for crate in $FORBIDDEN; do
            if cargo tree -i "$crate" ${{ matrix.cargo-scope }} --edges normal 2>/dev/null | grep -q "^$crate "; then
              echo "::error::Forbidden crate '$crate' is reachable in the resolved dependency graph."
              cargo tree -i "$crate" ${{ matrix.cargo-scope }} --edges normal
              exit 1
            fi
          done

          echo "resolved-graph check clean (${{ matrix.cargo-scope }})"

      - name: Assert the frontend has no outbound surface
        run: |
          set -uo pipefail

          # Every guard above audits Rust. The popover is a web view, and its
          # only protection until now was the CSP string in tauri.conf.json,
          # which nothing verified. Two halves: the CSP must still be exactly
          # `default-src 'self'`, and no frontend source may name a network API
          # or an absolute http(s) URL.
          TAURI_CONF=src-tauri/tauri.conf.json
          CSP_EXPECTED="\"csp\": \"default-src 'self'\""
          NET='fetch\(|WebSocket|XMLHttpRequest|EventSource|navigator\.sendBeacon|https?://'

          # The exact accepted form must match, or a typo in CSP_EXPECTED would
          # fail the build for the wrong reason and get "fixed" by weakening it.
          Q="'"
          printf '{ "security": { "csp": "default-src %sself%s" } }\n' "$Q" "$Q" > /tmp/csp-selftest-ok.json
          if ! grep -qF "$CSP_EXPECTED" /tmp/csp-selftest-ok.json; then
            echo "::error::Guard self-test failed: the CSP pattern no longer matches the accepted policy."
            exit 1
          fi
          # And a widened policy must NOT match: this is the failure the guard exists to catch.
          printf '{ "security": { "csp": "default-src %sself%s https://evil.example" } }\n' \
            "$Q" "$Q" > /tmp/csp-selftest-weak.json
          if grep -qF "$CSP_EXPECTED" /tmp/csp-selftest-weak.json; then
            echo "::error::Guard self-test failed: a widened CSP still matches the expected policy."
            exit 1
          fi

          if ! grep -qF "$CSP_EXPECTED" "$TAURI_CONF"; then
            echo "::error::$TAURI_CONF no longer sets exactly \"csp\": \"default-src 'self'\"."
            exit 1
          fi

          # Scans the frontend sources and the HTML entry point. Deliberately
          # scoped to src/ and index.html: the $schema URL in
          # src-tauri/capabilities/default.json is a JSON-schema reference, not
          # an outbound request, and widening this glob to catch it would only
          # teach the next person to loosen the pattern.
          frontend_hits() {
            { find src \( -name '*.ts' -o -name '*.tsx' \) -print0; printf '%s\0' index.html; } \
              | xargs -0 grep -nE "$NET"
          }

          # Positive control: the pattern must detect a known offender.
          printf 'const r = await fetch("https://example.com/x")\n' > /tmp/net-selftest.ts
          if ! grep -qE "$NET" /tmp/net-selftest.ts; then
            echo "::error::Guard self-test failed: the network pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the coverage: fixtures placed as if they were a
          # nested src/*.tsx and index.html (never the real tree — these live
          # entirely under /tmp) must both be found through the exact
          # frontend_hits path the real check uses.
          SELFTEST_ROOT=/tmp/no-network-selftest-frontend
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/src/nested"
          printf 'new WebSocket("wss://example.com")\n' > "$SELFTEST_ROOT/src/nested/x.tsx"
          printf '<script src="https://cdn.example/x.js"></script>\n' > "$SELFTEST_ROOT/index.html"
          selftest_hits=$( cd "$SELFTEST_ROOT" && frontend_hits )
          if ! printf '%s\n' "$selftest_hits" | grep -q 'src/nested/x.tsx'; then
            echo "::error::Guard self-test failed: the frontend scan no longer reaches nested src/*.tsx."
            exit 1
          fi
          if ! printf '%s\n' "$selftest_hits" | grep -q '^index.html'; then
            echo "::error::Guard self-test failed: the frontend scan no longer reaches index.html."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          hits=$(frontend_hits)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::The frontend gained an outbound network call or an absolute URL. The popover talks only to the Tauri backend."
            exit 1
          fi

          echo "frontend outbound surface clean (CSP pinned; no network APIs or absolute URLs in src/ or index.html)"

      - name: Assert the native macOS app has no outbound network surface
        run: |
          set -uo pipefail

          # The Swift app is a second UI surface (the native replacement for
          # the popover), so it gets the same promise as the frontend guard
          # above: no network APIs, no absolute http(s) URLs. Scoped to
          # Sources/Perch (the hand-written app) and NOT Sources/PerchFFI,
          # which is UniFFI's generated bindings — produced by
          # scripts/build-xcframework.sh, git-ignored, and simply absent on a
          # fresh checkout, so scanning it would find either nothing or code
          # nobody hand-writes.
          SWIFT_APP_SRC_DIR=apps/macos/Perch/Sources/Perch

          # "Network framework use" means `import Network` (the module Apple
          # ships NWConnection etc. in), not the literal string
          # "Network.framework" — that string names the compiled binary
          # framework, which never appears in Swift source itself.
          NET_SWIFT='URLSession|NSURLConnection|NWConnection|import[[:space:]]+Network\b|https?://'

          swift_hits() {
            # -H forces the filename prefix even when only one file matches
            # (grep omits it for a single-file argument list otherwise) —
            # without it, the self-test below can't find the offending path
            # in the output, and a real hit would be unattributable too.
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' -print0 | xargs -0 grep -nHE "$NET_SWIFT"
          }

          # Positive control: the pattern must actually detect a known offender.
          printf 'let s = URLSession.shared.dataTask(with: URL(string: "https://example.com")!)\n' \
            > /tmp/swift-net-selftest.swift
          if ! grep -qE "$NET_SWIFT" /tmp/swift-net-selftest.swift; then
            echo "::error::Guard self-test failed: the Swift network pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the coverage: a fixture placed as if it were
          # a nested file under Sources/Perch (never the real tree — this
          # lives entirely under /tmp) must be found through the exact
          # swift_hits path the real check uses below.
          SELFTEST_ROOT=/tmp/no-network-selftest-swift
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested"
          printf 'import Network\nlet c = NWConnection(host: "example.com", port: 443)\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested/x.swift"
          if ! ( cd "$SELFTEST_ROOT" && swift_hits ) | grep -q "$SWIFT_APP_SRC_DIR/Nested/x.swift"; then
            echo "::error::Guard self-test failed: the Swift scan no longer reaches a nested $SWIFT_APP_SRC_DIR/**/*.swift."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          hits=$(swift_hits)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::The native macOS app gained an outbound network call or an absolute URL. It talks only to perch-ffi."
            exit 1
          fi

          echo "native app outbound surface clean (no network APIs or absolute URLs in $SWIFT_APP_SRC_DIR)"

      - name: Assert only Launcher.swift writes to the filesystem, and no Swift source touches the Claude Code directory
        run: |
          set -uo pipefail

          # Mirrors the Rust filesystem-write audit above, for the same
          # reason: MainWindow/Launcher.swift is now the only
          # filesystem-writing code in the shipping product (it stages a
          # single-use launch script under .applicationSupportDirectory),
          # and until now nothing checked that the boundary stays there.
          # Scoped to Sources/Perch, never Sources/PerchFFI (UniFFI's
          # generated bindings — produced by scripts/build-xcframework.sh,
          # git-ignored, and simply absent on a fresh checkout).
          SWIFT_APP_SRC_DIR=apps/macos/Perch/Sources/Perch
          LAUNCHER_PATH="$SWIFT_APP_SRC_DIR/MainWindow/Launcher.swift"

          WRITE_APIS='\.write\(to:|FileManager\.default\.createDirectory|FileManager\.default\.removeItem|FileManager\.default\.createFile|FileManager\.default\.setAttributes|FileManager\.default\.moveItem|FileManager\.default\.copyItem|FileManager\.default\.trashItem|FileHandle\('

          # A reference to the Claude Code directory itself — as an actual
          # string literal or identifier a write could plausibly be aimed
          # at, not the word "Claude" alone (which appears constantly in
          # doc comments, e.g. "Nothing in Swift reads Claude Code's
          # files"). Requiring a quote before ".claude" is what excludes
          # Launcher.swift's own doc comments ("the read-only promise about
          # `~/.claude`", written in backticks, not a Swift string) while
          # still catching a real `"~/.claude"` or `"$HOME/.claude"` literal.
          CLAUDE_DIR_REF='"[^"]*\.claude|claudeConfig|ClaudeConfig|claudeDir|ClaudeDir|CLAUDE_CONFIG_DIR'

          # -H forces the filename prefix even when only one file matches
          # (grep omits it for a single-file argument list otherwise) — the
          # exact trap that silently broke a previous self-test in this
          # repo. Every lookup below uses it.
          write_hits() {
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' ! -path "$LAUNCHER_PATH" -print0 \
              | xargs -0 grep -nHE "$WRITE_APIS"
          }
          claude_dir_hits() {
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' -print0 \
              | xargs -0 grep -nHE "$CLAUDE_DIR_REF"
          }

          # Positive controls: each pattern must actually detect a known offender.
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' > /tmp/swift-write-selftest.swift
          if ! grep -qE "$WRITE_APIS" /tmp/swift-write-selftest.swift; then
            echo "::error::Guard self-test failed: the Swift write pattern no longer detects a known offender."
            exit 1
          fi
          printf 'let dir = base.appendingPathComponent("~/.claude")\n' > /tmp/swift-claudedir-selftest.swift
          if ! grep -qE "$CLAUDE_DIR_REF" /tmp/swift-claudedir-selftest.swift; then
            echo "::error::Guard self-test failed: the Claude-directory pattern no longer detects a known offender."
            exit 1
          fi
          # And the real doc comments in Launcher.swift (which mention
          # `~/.claude` in backticks, not a string literal) must NOT trip
          # the Claude-directory pattern — otherwise this guard would be
          # failing the one file it exists to keep honest.
          if grep -qE "$CLAUDE_DIR_REF" "$LAUNCHER_PATH"; then
            echo "::error::Guard self-test failed: the Claude-directory pattern now matches Launcher.swift's own doc comments."
            exit 1
          fi

          # Positive control for coverage: fixtures placed as if they were a
          # nested file under Sources/Perch, and as if they were
          # Launcher.swift itself (never the real tree — these live
          # entirely under /tmp) must be found (or, for the Launcher.swift
          # exclusion, deliberately NOT found) through the exact paths the
          # real checks above use.
          SELFTEST_ROOT=/tmp/no-network-selftest-swift-write
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested"
          mkdir -p "$SELFTEST_ROOT/$(dirname "$LAUNCHER_PATH")"
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested/x.swift"
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' \
            > "$SELFTEST_ROOT/$LAUNCHER_PATH"
          selftest_hits=$( cd "$SELFTEST_ROOT" && write_hits || true )
          if ! printf '%s\n' "$selftest_hits" | grep -q "$SWIFT_APP_SRC_DIR/Nested/x.swift"; then
            echo "::error::Guard self-test failed: the Swift write scan no longer reaches a nested $SWIFT_APP_SRC_DIR/**/*.swift."
            exit 1
          fi
          if printf '%s\n' "$selftest_hits" | grep -q "$LAUNCHER_PATH"; then
            echo "::error::Guard self-test failed: Launcher.swift is no longer excluded from the write scan."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          write_hits_out=$(write_hits || true)
          if [ -n "$write_hits_out" ]; then
            printf '%s\n' "$write_hits_out"
            echo "::error::A filesystem-writing API appeared outside Launcher.swift. Only Launcher.swift may write to disk, and only under .applicationSupportDirectory."
            exit 1
          fi

          claude_dir_hits_out=$(claude_dir_hits || true)
          if [ -n "$claude_dir_hits_out" ]; then
            printf '%s\n' "$claude_dir_hits_out"
            echo "::error::Swift source now references the Claude Code directory. Perch is read-only against ~/.claude, and Swift must not touch it either."
            exit 1
          fi

          echo "native app filesystem surface clean (writes confined to $LAUNCHER_PATH; no Swift source references the Claude Code directory)"

  native-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-xcframework.sh
      - run: swift build -c release
        working-directory: apps/macos/Perch
