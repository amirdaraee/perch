name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Every crate in the workspace is portable, so both runners build all of
      # it. macOS is where the app is shipped from; Linux is what keeps the
      # data layer honest — perch-core, perch-ffi and perch-mcp must not
      # quietly grow a macOS-only dependency, because a later Linux or Windows
      # shell is meant to reuse them.
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  no-network:
    strategy:
      fail-fast: false
      # Mirrors the `test` job, and for the same reason.
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert no HTTP client or telemetry dependencies
        run: |
          set -uo pipefail

          HTTP='^(reqwest|hyper|ureq|curl|isahc|surf)\b'
          TELEMETRY='^(sentry|posthog|segment|mixpanel|datadog|analytics)\b'

          # Named as its own variable (rather than inlined below) so the
          # self-test right below reuses the identical glob — a typo here would
          # otherwise fail silently and the self-test would never catch it.
          CRATE_MANIFESTS='crates/*/Cargo.toml'

          # Positive control: the patterns must actually detect a known offender.
          # Without this, a future edit that breaks the regex would pass silently forever —
          # which is exactly the failure this guard was found to have.
          printf 'reqwest.workspace = true\n' > /tmp/guard-selftest.toml
          if ! grep -qE "$HTTP" /tmp/guard-selftest.toml; then
            echo "::error::Guard self-test failed: the HTTP pattern no longer detects a known offender."
            exit 1
          fi
          # Positive control for the per-crate coverage: a fixture placed as if
          # it were a newly added crate's manifest (never a real file — this
          # lives entirely under /tmp), scanned through the exact glob the real
          # check below uses, must trip the guard. A crate added later is
          # otherwise caught only indirectly via the resolved-graph check.
          SELFTEST_ROOT=/tmp/no-network-selftest-manifest
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/crates/newcomer"
          printf 'reqwest.workspace = true\n' > "$SELFTEST_ROOT/crates/newcomer/Cargo.toml"
          if ! ( cd "$SELFTEST_ROOT" && grep -rEn "$HTTP" $CRATE_MANIFESTS ) > /dev/null; then
            echo "::error::Guard self-test failed: the manifest glob no longer reaches $CRATE_MANIFESTS."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Manifests: matches both `dep = "1"` and `dep.workspace = true`.
          if grep -rEn "$HTTP" Cargo.toml $CRATE_MANIFESTS; then
            echo "::error::An HTTP client was added. The data layer must make no outbound requests."
            exit 1
          fi
          if grep -rEni "$TELEMETRY" Cargo.toml $CRATE_MANIFESTS; then
            echo "::error::Telemetry dependency detected. Perch ships no telemetry."
            exit 1
          fi

          echo "no HTTP client or telemetry dependencies found (workspace root and $CRATE_MANIFESTS)"

      - name: Assert no hand-rolled sockets in the source
        run: |
          set -uo pipefail

          # A dependency audit alone cannot see a socket opened with std::net,
          # which needs no dependency at all. Spec 10 promises a dependency AND
          # source audit; this is the source half.
          SOCKETS='std::net|TcpStream|UdpSocket|TcpListener'

          # Positive control: the pattern must actually detect a known offender.
          printf 'let s = TcpStream::connect("example.com:80")?;\n' > /tmp/socket-selftest.rs
          if ! grep -qE "$SOCKETS" /tmp/socket-selftest.rs; then
            echo "::error::Guard self-test failed: the socket pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the coverage: a fixture placed as if it were a
          # deeply nested module in a crate added later (never the real source
          # tree — this lives entirely under /tmp), discovered through the exact
          # `find` expression the real audit below uses, must trip the guard.
          # Nested because `-path 'crates/*/src/*'` is easy to tighten by
          # accident into something that only reaches the top level.
          SELFTEST_ROOT=/tmp/no-network-selftest-socket
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/crates/newcomer/src/deep/nested"
          printf 'fn x() { let _ = TcpStream::connect("example.com:80"); }\n' \
            > "$SELFTEST_ROOT/crates/newcomer/src/deep/nested/x.rs"
          if ! ( cd "$SELFTEST_ROOT" && find crates -path 'crates/*/src/*' -name '*.rs' -print0 \
                 | xargs -0 grep -qE "$SOCKETS" ); then
            echo "::error::Guard self-test failed: the source-audit root no longer reaches nested crates/*/src files."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          if find crates -path 'crates/*/src/*' -name '*.rs' -print0 \
             | xargs -0 grep -nE "$SOCKETS"; then
            echo "::error::A raw socket appears in the source. The data layer makes no outbound requests."
            exit 1
          fi

          echo "no raw sockets found in crates/*/src"

      - name: Assert perch-core, perch-ffi and perch-mcp never write to the filesystem
        run: |
          set -uo pipefail

          # The README's other headline promise: Perch never writes to, moves, or
          # deletes anything in your Claude Code directory. perch-core is the only
          # crate that reads that directory; perch-ffi is the UniFFI surface that
          # resolves Perch's own data path (app_data_db) and drives indexing for
          # the native macOS app, so a stray write there would be exactly as
          # bad; and perch-mcp hands the same data to other tools. All three
          # must hold no filesystem-writing API outside of Perch's own data.
          #
          # `create_dir_all` is deliberately NOT in this list, and exactly two
          # files under perch-core are deliberately excluded, each for a write
          # to Perch's OWN data, never anything inside the Claude Code
          # directory: db.rs creates the parent directory of and opens Perch's
          # own index database, and settings/store.rs creates the parent
          # directory of and writes Perch's own config.toml. Both exclusions
          # below use `-path` (the full path from the repo root) rather than
          # `-name` (the basename alone) — `-name 'db.rs'` or `-name
          # 'store.rs'` would silently exclude *any* file with that basename
          # anywhere under the tree, not just these two exact files. Copy this
          # `-path`, not `-name`, if a third file ever needs excluding here.
          # Nothing under crates/perch-ffi/src or crates/perch-mcp/src is
          # excluded — neither performs a write of its own (both delegate to
          # perch-core), so every module in them is audited alike.
          WRITES='fs::write|fs::remove_file|fs::remove_dir|File::create|OpenOptions'
          FFI_SRC_DIR=crates/perch-ffi/src
          # perch-mcp reads the index read-only and answers on stdout; nothing
          # in it has any business writing a file, so nothing is excluded.
          MCP_SRC_DIR=crates/perch-mcp/src

          # Only the production half of each file is audited. Test modules write
          # fixtures into a tempdir, which is legitimate and never ships; `prod`
          # cuts each file at its `#[cfg(test)]` line.
          prod() { awk '/^#\[cfg\(test\)\]/{exit} {print FILENAME ":" FNR ": " $0}' "$1"; }

          # Positive control, through the very same `prod` + grep path the real
          # check uses, so a break in either half fails here first.
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' > /tmp/write-selftest.rs
          if ! prod /tmp/write-selftest.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the write pattern no longer detects a known offender."
            exit 1
          fi
          # And the exclusion itself must work: a match below #[cfg(test)] is ignored.
          printf '#[cfg(test)]\nmod tests { fs::write("/tmp/x", "y"); }\n' > /tmp/write-selftest-cfg.rs
          if prod /tmp/write-selftest-cfg.rs | grep -qE "$WRITES"; then
            echo "::error::Guard self-test failed: the #[cfg(test)] exclusion is not excluding."
            exit 1
          fi

          # Positive control for the perch-ffi coverage: a fixture placed as if
          # it were crates/perch-ffi/src/x.rs (never the real source tree — this
          # lives entirely under /tmp) must trip the guard. No exclusion is
          # needed here (unlike perch-core's db.rs): perch-ffi has no file of
          # its own that opens or creates Perch's database — it calls
          # perch-core's db::open for that — so nothing in its source is a
          # legitimate write to exclude.
          SELFTEST_ROOT=/tmp/no-network-selftest-write-ffi
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$FFI_SRC_DIR"
          printf 'fn main() { File::create("/tmp/x").unwrap(); }\n' \
            > "$SELFTEST_ROOT/$FFI_SRC_DIR/x.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find "$FFI_SRC_DIR" -name '*.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: the write guard no longer reaches $FFI_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Positive control for the perch-mcp coverage, same shape as perch-ffi's.
          SELFTEST_ROOT=/tmp/no-network-selftest-write-mcp
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$MCP_SRC_DIR"
          printf 'fn main() { OpenOptions::new().write(true); }\n' \
            > "$SELFTEST_ROOT/$MCP_SRC_DIR/x.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find "$MCP_SRC_DIR" -name '*.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: the write guard no longer reaches $MCP_SRC_DIR."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          # Positive control proving the perch-core exclusions are matched by
          # full path, not basename: a decoy file with the *same basename* as
          # an excluded file, but at a *different path* (never the real source
          # tree — this lives entirely under /tmp), must still trip the
          # guard. If either exclusion below used `-name` instead of `-path`,
          # these decoys would be silently excluded too and this self-test
          # would fail. Mirrors the analogous same-basename check the Swift
          # guard runs for Launcher.swift.
          SELFTEST_ROOT=/tmp/no-network-selftest-write-core-path
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/crates/perch-core/src/decoy"
          mkdir -p "$SELFTEST_ROOT/crates/perch-core/src/settings/decoy"
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' \
            > "$SELFTEST_ROOT/crates/perch-core/src/decoy/db.rs"
          printf 'fn main() { fs::write("/tmp/x", "y").unwrap(); }\n' \
            > "$SELFTEST_ROOT/crates/perch-core/src/settings/decoy/store.rs"
          offending=0
          for f in $(cd "$SELFTEST_ROOT" && find crates/perch-core/src -name '*.rs' \
                       ! -path 'crates/perch-core/src/db.rs' \
                       ! -path 'crates/perch-core/src/settings/store.rs'); do
            if prod "$SELFTEST_ROOT/$f" | grep -qE "$WRITES"; then
              offending=1
            fi
          done
          if [ "$offending" -ne 1 ]; then
            echo "::error::Guard self-test failed: a same-basename decoy (db.rs or store.rs) at a different path was wrongly excluded — the exclusion must match by full path, not basename."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          offenders=0
          for f in $(find crates/perch-core/src -name '*.rs' \
                       ! -path 'crates/perch-core/src/db.rs' \
                       ! -path 'crates/perch-core/src/settings/store.rs') \
                   $(find "$FFI_SRC_DIR" -name '*.rs') \
                   $(find "$MCP_SRC_DIR" -name '*.rs'); do
            if prod "$f" | grep -E "$WRITES"; then
              offenders=1
            fi
          done
          if [ "$offenders" -ne 0 ]; then
            echo "::error::perch-core, perch-ffi or perch-mcp gained a filesystem-writing call. Perch is read-only with respect to ~/.claude."
            exit 1
          fi

          echo "no filesystem writes found in perch-core (db.rs and settings/store.rs excluded), $FFI_SRC_DIR, or $MCP_SRC_DIR (nothing excluded)"

      - name: Assert forbidden crates are unreachable in the resolved dependency graph
        run: |
          set -uo pipefail

          # A lockfile lists every platform's dependencies, including ones
          # gated to targets this workspace never builds — which produced a
          # false positive when this was a plain `grep Cargo.lock` (found by
          # actually running the check by hand). `cargo tree -i` against the
          # HOST build graph keeps the property we wanted from the lockfile
          # scan — catching transitive pulls that no manifest names — while
          # ignoring deps that can never be compiled here.
          FORBIDDEN="reqwest hyper ureq curl isahc surf sentry posthog segment mixpanel datadog"

          # `cargo tree -i <crate-absent-from-the-graph>` prints a "nothing to
          # print" warning to stderr and exits 0 (verified by hand: `cargo
          # tree -i reqwest -p perch-core; echo $?` prints the warning and
          # `0`). So this checks stdout content, never the exit code — trusting
          # the exit code here would make every iteration of the loop below
          # silently "pass" regardless of what is actually in the graph.
          #
          # Positive control: the probe must find a crate that IS present, or
          # a broken invocation would silently pass everything. serde is
          # depended on by every workspace member, so this also proves the
          # invocation itself is well-formed. A malformed one (e.g. a typo'd
          # flag) would make every `cargo tree` call below fail with empty
          # stdout, which reads as "crate absent" and would let the job report
          # clean; catching that here is the whole point of a self-test.
          if ! cargo tree -i serde --workspace --edges normal 2>/dev/null | grep -q '^serde '; then
            echo "::error::Guard self-test failed: cargo tree did not find serde in the workspace graph."
            exit 1
          fi

          for crate in $FORBIDDEN; do
            if cargo tree -i "$crate" --workspace --edges normal 2>/dev/null | grep -q "^$crate "; then
              echo "::error::Forbidden crate '$crate' is reachable in the resolved dependency graph."
              cargo tree -i "$crate" --workspace --edges normal
              exit 1
            fi
          done

          echo "resolved-graph check clean (--workspace)"

      - name: Assert the native macOS app has no outbound network surface
        run: |
          set -uo pipefail

          # Every guard above audits Rust. The Swift app is the UI surface, and
          # it gets the same promise the data layer does: no network APIs, no
          # absolute http(s) URLs. Scoped to
          # Sources/Perch (the hand-written app) and NOT Sources/PerchFFI,
          # which is UniFFI's generated bindings — produced by
          # scripts/build-xcframework.sh, git-ignored, and simply absent on a
          # fresh checkout, so scanning it would find either nothing or code
          # nobody hand-writes.
          SWIFT_APP_SRC_DIR=apps/macos/Perch/Sources/Perch

          # "Network framework use" means `import Network` (the module Apple
          # ships NWConnection etc. in), not the literal string
          # "Network.framework" — that string names the compiled binary
          # framework, which never appears in Swift source itself.
          NET_SWIFT='URLSession|NSURLConnection|NWConnection|import[[:space:]]+Network\b|https?://'

          swift_hits() {
            # -H forces the filename prefix even when only one file matches
            # (grep omits it for a single-file argument list otherwise) —
            # without it, the self-test below can't find the offending path
            # in the output, and a real hit would be unattributable too.
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' -print0 | xargs -0 grep -nHE "$NET_SWIFT"
          }

          # Positive control: the pattern must actually detect a known offender.
          printf 'let s = URLSession.shared.dataTask(with: URL(string: "https://example.com")!)\n' \
            > /tmp/swift-net-selftest.swift
          if ! grep -qE "$NET_SWIFT" /tmp/swift-net-selftest.swift; then
            echo "::error::Guard self-test failed: the Swift network pattern no longer detects a known offender."
            exit 1
          fi

          # Positive control for the coverage: a fixture placed as if it were
          # a nested file under Sources/Perch (never the real tree — this
          # lives entirely under /tmp) must be found through the exact
          # swift_hits path the real check uses below.
          SELFTEST_ROOT=/tmp/no-network-selftest-swift
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested"
          printf 'import Network\nlet c = NWConnection(host: "example.com", port: 443)\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested/x.swift"
          if ! ( cd "$SELFTEST_ROOT" && swift_hits ) | grep -q "$SWIFT_APP_SRC_DIR/Nested/x.swift"; then
            echo "::error::Guard self-test failed: the Swift scan no longer reaches a nested $SWIFT_APP_SRC_DIR/**/*.swift."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          hits=$(swift_hits || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::The native macOS app gained an outbound network call or an absolute URL. It talks only to perch-ffi."
            exit 1
          fi

          echo "native app outbound surface clean (no network APIs or absolute URLs in $SWIFT_APP_SRC_DIR)"

      - name: Assert only Launcher.swift writes to the filesystem, and no Swift source touches the Claude Code directory
        run: |
          set -uo pipefail

          # Mirrors the Rust filesystem-write audit above, for the same
          # reason: MainWindow/Launcher.swift is now the only
          # filesystem-writing code in the shipping product (it stages a
          # single-use launch script under .applicationSupportDirectory),
          # and until now nothing checked that the boundary stays there.
          # Scoped to Sources/Perch, never Sources/PerchFFI (UniFFI's
          # generated bindings — produced by scripts/build-xcframework.sh,
          # git-ignored, and simply absent on a fresh checkout).
          SWIFT_APP_SRC_DIR=apps/macos/Perch/Sources/Perch
          LAUNCHER_PATH="$SWIFT_APP_SRC_DIR/MainWindow/Launcher.swift"

          WRITE_APIS='\.write\(to:|FileManager\.default\.createDirectory|FileManager\.default\.removeItem|FileManager\.default\.createFile|FileManager\.default\.setAttributes|FileManager\.default\.moveItem|FileManager\.default\.copyItem|FileManager\.default\.trashItem|FileHandle\('

          # A reference to the Claude Code directory itself — either Swift
          # constructing a path into it (a string literal containing
          # ".claude"), or Swift reading CLAUDE_CONFIG_DIR directly (which
          # would bypass Rust's documented resolution precedence). Not the
          # word "Claude" alone (which appears constantly in doc comments,
          # e.g. "Nothing in Swift reads Claude Code's files"), and
          # deliberately NOT bare camelCase identifiers like
          # claudeConfigDir/claudeDirDraft/chooseClaudeDir — that is
          # vocabulary the settings UI (which lets the user point Perch at
          # their Claude Code directory, entirely through Rust) is allowed
          # to use. Requiring a quote before ".claude" is what excludes
          # Launcher.swift's own doc comments ("the read-only promise about
          # `~/.claude`", written in backticks, not a Swift string) while
          # still catching a real `"~/.claude"` or `"$HOME/.claude"` literal.
          CLAUDE_DIR_REF='"[^"]*\.claude|CLAUDE_CONFIG_DIR'

          # -H forces the filename prefix even when only one file matches
          # (grep omits it for a single-file argument list otherwise) — the
          # exact trap that silently broke a previous self-test in this
          # repo. Every lookup below uses it.
          write_hits() {
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' ! -path "$LAUNCHER_PATH" -print0 \
              | xargs -0 grep -nHE "$WRITE_APIS"
          }
          claude_dir_hits() {
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' -print0 \
              | xargs -0 grep -nHE "$CLAUDE_DIR_REF"
          }

          # Positive controls: each pattern must actually detect a known offender.
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' > /tmp/swift-write-selftest.swift
          if ! grep -qE "$WRITE_APIS" /tmp/swift-write-selftest.swift; then
            echo "::error::Guard self-test failed: the Swift write pattern no longer detects a known offender."
            exit 1
          fi
          printf 'let dir = base.appendingPathComponent("~/.claude")\n' > /tmp/swift-claudedir-selftest.swift
          if ! grep -qE "$CLAUDE_DIR_REF" /tmp/swift-claudedir-selftest.swift; then
            echo "::error::Guard self-test failed: the Claude-directory pattern no longer detects a known offender."
            exit 1
          fi
          # And a bare camelCase identifier — the settings UI's own
          # vocabulary for the "which directory is Claude Code's" concept,
          # with no string literal and no env var read — must NOT trip the
          # pattern, or this guard would be blind exactly where a real
          # violation is now most likely to appear.
          printf 'private var claudeConfigDir: String { claudeDirDraft }\n' > /tmp/swift-claudedir-negative-selftest.swift
          if grep -qE "$CLAUDE_DIR_REF" /tmp/swift-claudedir-negative-selftest.swift; then
            echo "::error::Guard self-test failed: the Claude-directory pattern now matches a bare identifier, not just path/env-var access."
            exit 1
          fi
          # And the real doc comments in Launcher.swift (which mention
          # `~/.claude` in backticks, not a string literal) must NOT trip
          # the Claude-directory pattern — otherwise this guard would be
          # failing the one file it exists to keep honest.
          if grep -qE "$CLAUDE_DIR_REF" "$LAUNCHER_PATH"; then
            echo "::error::Guard self-test failed: the Claude-directory pattern now matches Launcher.swift's own doc comments."
            exit 1
          fi

          # Positive control for coverage: fixtures placed as if they were a
          # nested file under Sources/Perch, and as if they were
          # Launcher.swift itself (never the real tree — these live
          # entirely under /tmp) must be found (or, for the Launcher.swift
          # exclusion, deliberately NOT found) through the exact paths the
          # real checks above use.
          #
          # The third fixture is a decoy with the *same basename* as the
          # excluded file at a *different path*: it must still be found,
          # which is what proves the exclusion matches by full path and not
          # by basename. Weaken `! -path "$LAUNCHER_PATH"` to
          # `! -name Launcher.swift` and this decoy disappears from the scan
          # and this self-test fails — which is the whole point of it, and
          # the check the Rust guard's own same-basename decoys cite as
          # their model.
          SELFTEST_ROOT=/tmp/no-network-selftest-swift-write
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Decoy"
          mkdir -p "$SELFTEST_ROOT/$(dirname "$LAUNCHER_PATH")"
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested/x.swift"
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Decoy/$(basename "$LAUNCHER_PATH")"
          printf 'try body.write(to: url, atomically: true, encoding: .utf8)\n' \
            > "$SELFTEST_ROOT/$LAUNCHER_PATH"
          selftest_hits=$( cd "$SELFTEST_ROOT" && write_hits || true )
          if ! printf '%s\n' "$selftest_hits" | grep -q "$SWIFT_APP_SRC_DIR/Nested/x.swift"; then
            echo "::error::Guard self-test failed: the Swift write scan no longer reaches a nested $SWIFT_APP_SRC_DIR/**/*.swift."
            exit 1
          fi
          if ! printf '%s\n' "$selftest_hits" | grep -q "$SWIFT_APP_SRC_DIR/Decoy/$(basename "$LAUNCHER_PATH")"; then
            echo "::error::Guard self-test failed: a same-basename decoy at a different path was wrongly excluded — the Launcher.swift exclusion must match by full path, not basename."
            exit 1
          fi
          if printf '%s\n' "$selftest_hits" | grep -q "^$LAUNCHER_PATH:"; then
            echo "::error::Guard self-test failed: Launcher.swift is no longer excluded from the write scan."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          write_hits_out=$(write_hits || true)
          if [ -n "$write_hits_out" ]; then
            printf '%s\n' "$write_hits_out"
            echo "::error::A filesystem-writing API appeared outside Launcher.swift. Only Launcher.swift may write to disk, and only under .applicationSupportDirectory."
            exit 1
          fi

          claude_dir_hits_out=$(claude_dir_hits || true)
          if [ -n "$claude_dir_hits_out" ]; then
            printf '%s\n' "$claude_dir_hits_out"
            echo "::error::Swift source now references the Claude Code directory. Perch is read-only against ~/.claude, and Swift must not touch it either."
            exit 1
          fi

          echo "native app filesystem surface clean (writes confined to $LAUNCHER_PATH; no Swift source references the Claude Code directory)"

      - name: Assert no Swift source composes a user-visible caption from a number
        run: |
          set -uo pipefail

          # Rust owns everything except drawing: every string the UI shows is
          # composed in perch-core, and Swift never formats a number, a
          # duration, or a currency. Three defects in the settings milestone
          # came from breaking exactly this, and "Check every 1 seconds"
          # reached a shipped build twice, because nothing checked it.
          #
          # Scoped to Sources/Perch, which is the hand-written Swift.
          # Sources/PerchFFI is a sibling directory and therefore out of
          # scope by construction: it is UniFFI's generated bindings, built
          # by scripts/build-xcframework.sh, git-ignored, and absent on a
          # fresh checkout.
          #
          # Line-oriented, like every other guard here: a Text(...) split
          # across lines with its interpolation on a line of its own is not
          # seen. Every Text literal in the tree is written on one line, and
          # a guard that catches the shape people actually write beats one
          # that catches none of them.
          SWIFT_APP_SRC_DIR=apps/macos/Perch/Sources/Perch

          # An interpolation inside a Text literal whose contents are
          # visibly numeric: a numeric literal (a digit that does not sit
          # inside an identifier, so `v2Label` is not a number), arithmetic,
          # `.count`, a numeric conversion or format call, or a format
          # specifier.
          NUMBER_IN_TEXT='Text\(.*\\\(([^()"]*[^A-Za-z0-9_])?[0-9]|Text\(.*\\\([^()"]*([-+*/%]|\.count|\.formatted|\.rounded|\.magnitude|(Int|UInt|Int32|Int64|UInt32|UInt64|Double|Float|CGFloat|Decimal|NSNumber)\(|String\(format:|specifier:)'

          # The other half, and the one that actually shipped: an
          # interpolation followed by a counted noun. `"Check every
          # \(seconds) seconds"` names no number syntactically — only its
          # unit gives it away — and the pluralisation it gets wrong is
          # precisely what Rust's counted_stepper already composes
          # correctly.
          COUNTED_NOUN_IN_TEXT='Text\(.*\\\([^()"]*\)[[:space:]]*(second|minute|hour|day|week|month|year|session|project|token|turn|item|file|row|model|character|byte|entr(y|ies))'

          # -H forces the filename prefix even when only one file matches
          # (grep omits it for a single-file argument list otherwise) — the
          # exact trap that silently broke a previous self-test here.
          text_number_hits() {
            find "$SWIFT_APP_SRC_DIR" -name '*.swift' -print0 \
              | xargs -0 grep -nHE "$NUMBER_IN_TEXT|$COUNTED_NOUN_IN_TEXT"
          }

          # Positive control, both halves of the pattern.
          printf 'Text("\\(remaining - 1) left")\n' > /tmp/swift-text-number-selftest.swift
          if ! grep -nHE "$NUMBER_IN_TEXT" /tmp/swift-text-number-selftest.swift > /dev/null; then
            echo "::error::Guard self-test failed: the numeric-interpolation pattern no longer detects a number composed into a Text."
            exit 1
          fi
          printf 'Text("Check every \\(pollSeconds) seconds")\n' > /tmp/swift-text-plural-selftest.swift
          if ! grep -nHE "$COUNTED_NOUN_IN_TEXT" /tmp/swift-text-plural-selftest.swift > /dev/null; then
            echo "::error::Guard self-test failed: the counted-noun pattern no longer detects a caption pluralised in Swift."
            exit 1
          fi

          # Negative control: joining two strings that are already finished
          # in Rust is legitimate and must keep passing — UsageView.swift
          # does exactly this to build a VoiceOver label out of a day label
          # and a class label. A guard that flags it gets disabled the first
          # time it cries wolf, so its innocence is checked, not assumed.
          printf 'Text("\\(segment.dayLabel), \\(segment.classLabel)")\n' > /tmp/swift-text-strings-selftest.swift
          if grep -nHE "$NUMBER_IN_TEXT|$COUNTED_NOUN_IN_TEXT" /tmp/swift-text-strings-selftest.swift > /dev/null; then
            echo "::error::Guard self-test failed: the pattern now flags two already-finished Rust strings joined in a Text."
            exit 1
          fi
          # And interpolating a user's search query into a sentence — which
          # SettingsWindow.swift really does — is a string, not a number.
          printf 'Text("No setting matches \\u{201C}\\(query)\\u{201D}.")\n' > /tmp/swift-text-query-selftest.swift
          if grep -nHE "$NUMBER_IN_TEXT|$COUNTED_NOUN_IN_TEXT" /tmp/swift-text-query-selftest.swift > /dev/null; then
            echo "::error::Guard self-test failed: the pattern now flags a string interpolated into a sentence."
            exit 1
          fi

          # Positive control for coverage: a fixture placed as if it were a
          # nested file under Sources/Perch (never in the real tree — it
          # lives entirely under /tmp) must be found through the exact path
          # the real check uses, and its sibling under Sources/PerchFFI must
          # not be.
          SELFTEST_ROOT=/tmp/swift-text-number-selftest-tree
          rm -rf "$SELFTEST_ROOT"
          mkdir -p "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested"
          mkdir -p "$SELFTEST_ROOT/apps/macos/Perch/Sources/PerchFFI"
          printf 'Text("Check every \\(pollSeconds) seconds")\n' \
            > "$SELFTEST_ROOT/$SWIFT_APP_SRC_DIR/Nested/x.swift"
          printf 'Text("Check every \\(pollSeconds) seconds")\n' \
            > "$SELFTEST_ROOT/apps/macos/Perch/Sources/PerchFFI/perch_ffi.swift"
          selftest_hits=$( cd "$SELFTEST_ROOT" && text_number_hits || true )
          if ! printf '%s\n' "$selftest_hits" | grep -q "$SWIFT_APP_SRC_DIR/Nested/x.swift"; then
            echo "::error::Guard self-test failed: the Text scan no longer reaches a nested $SWIFT_APP_SRC_DIR/**/*.swift."
            exit 1
          fi
          if printf '%s\n' "$selftest_hits" | grep -q "Sources/PerchFFI"; then
            echo "::error::Guard self-test failed: the Text scan now reaches the generated bindings under Sources/PerchFFI."
            exit 1
          fi
          rm -rf "$SELFTEST_ROOT"

          hits=$(text_number_hits || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Swift composed a user-visible caption from a number. Every displayed string is Rust's to compose (perch-core); Swift draws it. Add or extend the string in perch-core and carry it across the FFI."
            exit 1
          fi

          echo "no numeric captions composed in Swift ($SWIFT_APP_SRC_DIR)"

  native-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-xcframework.sh
      - run: swift build -c release
        working-directory: apps/macos/Perch
