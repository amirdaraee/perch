name: Bug report
description: Something in Perch behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't paste transcript contents.** Perch goes to some trouble
        never to read what your sessions say; the bug tracker shouldn't undo
        that. Counts, paths and timings are fine.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the main window
        2. Select a project in the sidebar
        3. …
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings (⌘,) → Diagnostics. It names the resolved Claude Code
        directory and how it was resolved, the config file's path and whether
        it loaded, and the index's path, counts and last run. For anything
        shaped like "my session isn't showing up", this usually contains the
        answer outright.
      render: text

  - type: input
    id: version
    attributes:
      label: Perch version
      description: Settings → Advanced, or the release you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.3, M2 MacBook Air"
    validations:
      required: true
