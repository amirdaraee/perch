# Workflow actions are pinned to commit SHAs, which never update themselves.
# This proposes the bumps as pull requests, so they arrive reviewed rather than
# by someone moving a tag.
#
# Cargo updates are grouped into one monthly pull request. They update crates
# already in the tree; adding a new dependency is still a decision for an
# issue first (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
